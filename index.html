<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Finanzas</title>
  <meta name="description" content="App personal para registrar ingresos, gastos, presupuestos y metas de ahorro.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mis Finanzas">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body>
  <!-- Inicio de sesión (solo si Firebase está configurado) -->
  <div id="authScreen" class="auth" hidden>
    <div class="auth-card">
      <img src="icons/icon.svg" alt="" width="64" height="64">
      <h1>Mis Finanzas</h1>
      <div id="authLoading" class="auth-loading">
        <div class="spinner" aria-hidden="true"></div>
        <p id="authLoadingText">Cargando…</p>
        <button type="button" class="btn" id="authRetry" hidden>Reintentar</button>
      </div>
      <div id="authPanel" hidden>
        <p class="muted" id="authTitle">Inicia sesión para ver tus finanzas</p>
        <form id="authForm" novalidate>
          <label class="field" id="nameField" hidden>Nombre
            <input type="text" name="name" autocomplete="name" maxlength="60" placeholder="Tu nombre">
          </label>
          <label class="field">Correo
            <input type="email" name="email" required autocomplete="email" placeholder="tucorreo@gmail.com">
          </label>
          <label class="field">Contraseña
            <input type="password" name="password" required minlength="6" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
          </label>
          <button type="submit" class="btn primary" id="authSubmit">Entrar</button>
        </form>
        <p id="authMsg" class="auth-msg" role="alert"></p>
        <button type="button" class="link-btn" id="authReset">Olvidé mi contraseña</button>
        <div id="authGoogleWrap">
          <div class="divider"><span>o</span></div>
          <button type="button" class="btn google" id="authGoogle">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
            Continuar con Google
          </button>
        </div>
        <button type="button" class="link-btn" id="authToggle">¿No tienes cuenta? Crear una</button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1>Mis Finanzas</h1>
      <div class="month-picker" id="monthPicker">
        <button id="prevMonth" aria-label="Mes anterior">‹</button>
        <span id="monthLabel"></span>
        <button id="nextMonth" aria-label="Mes siguiente">›</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="view-inicio" class="view active"></section>

    <section id="view-movimientos" class="view">
      <div class="toolbar">
        <input type="search" id="txSearch" placeholder="Buscar por nota o categoría…" autocomplete="off">
        <select id="txType" aria-label="Filtrar por tipo">
          <option value="todos">Todos</option>
          <option value="gasto">Gastos</option>
          <option value="ingreso">Ingresos</option>
          <option value="transferencia">Transferencias</option>
        </select>
      </div>
      <div id="txList"></div>
    </section>

    <section id="view-presupuesto" class="view"></section>
    <section id="view-metas" class="view"></section>
    <section id="view-ajustes" class="view"></section>
  </main>

  <button id="fab" class="fab" aria-label="Agregar movimiento">+</button>

  <nav class="tabs" aria-label="Secciones">
    <div class="wrap tabs-inner">
      <button data-view="inicio" class="active"><span aria-hidden="true">🏠</span>Inicio</button>
      <button data-view="movimientos"><span aria-hidden="true">📋</span>Movimientos</button>
      <button data-view="presupuesto"><span aria-hidden="true">🎯</span>Presupuesto</button>
      <button data-view="metas"><span aria-hidden="true">🐷</span>Metas</button>
      <button data-view="ajustes"><span aria-hidden="true">⚙️</span>Ajustes</button>
    </div>
  </nav>

  <!-- Formulario de movimiento -->
  <dialog id="txDialog">
    <form id="txForm" method="dialog">
      <h2 id="txTitle">Nuevo movimiento</h2>
      <div class="segmented" role="radiogroup" aria-label="Tipo">
        <label><input type="radio" name="type" value="gasto" checked><span>Gasto</span></label>
        <label><input type="radio" name="type" value="ingreso"><span>Ingreso</span></label>
        <label><input type="radio" name="type" value="transferencia"><span>Transferencia</span></label>
      </div>
      <label class="field">Monto
        <input type="number" name="amount" inputmode="decimal" step="0.01" min="0.01" required placeholder="0.00">
      </label>
      <label class="field">Fecha
        <input type="date" name="date" required>
      </label>
      <label class="field" id="catField">Categoría
        <select name="categoryId"></select>
      </label>
      <label class="field"><span id="accountLabel">Cuenta</span>
        <select name="accountId"></select>
      </label>
      <label class="field" id="toAccountField" hidden>Hacia la cuenta
        <select name="toAccountId"></select>
      </label>
      <label class="field">Nota (opcional)
        <input type="text" name="note" maxlength="120" placeholder="Ej: supermercado, almuerzo…">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn danger ghost" id="txDelete" hidden>Eliminar</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Formulario de meta -->
  <dialog id="goalDialog">
    <form id="goalForm" method="dialog">
      <h2 id="goalTitle">Nueva meta</h2>
      <label class="field">Nombre
        <input type="text" name="name" required maxlength="60" placeholder="Ej: Fondo de emergencia">
      </label>
      <label class="field">Monto objetivo
        <input type="number" name="target" inputmode="decimal" step="0.01" min="0" required>
      </label>
      <label class="field">Ahorrado hasta ahora
        <input type="number" name="saved" inputmode="decimal" step="0.01" min="0" value="0">
      </label>
      <label class="field">Fecha límite (opcional)
        <input type="date" name="deadline">
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn danger ghost" id="goalDelete" hidden>Eliminar</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Abonar / retirar de una meta -->
  <dialog id="depositDialog">
    <form id="depositForm" method="dialog">
      <h2 id="depositTitle">Abonar</h2>
      <label class="field">Monto
        <input type="number" name="amount" inputmode="decimal" step="0.01" min="0.01" required>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <span class="spacer"></span>
        <button type="submit" class="btn ghost" value="retirar">Retirar</button>
        <button type="submit" class="btn primary" value="abonar">Abonar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
